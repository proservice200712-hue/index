// =====================================================================
//  ALPAKA — co 5 minut dobiega do 1/4 ekranu, mruga i wraca
// =====================================================================
// losowo: wybiega z lewej, z prawej albo (w stoisku) spada na spadochronie ze środkowej belki nad zegarem
// stroje alpaki (losowane przy każdym wyjściu): październik (do Halloween) — dynia
// (postacie z horrorów były mało czytelne); grudzień — gwiazdor, renifer Rudolf albo elf; w pozostałe miesiące zwykła
const pickW = list => { let r = Math.random() * list.reduce((a, [, w]) => a + w, 0); for (const [v, w] of list) { if ((r -= w) < 0) return v; } return list[0][0]; };
function alpacaCostume() {
  const a = $('alpaca'); if (!a) return;
  const m = new Date().getMonth();
  a.dataset.costume = m === 9 ? 'pumpkin'
    : m === 11 ? pickW([['santa', 45], ['rudolph', 30], ['elf', 25]]) : '';
}
alpacaCostume();
function runAlpaca() {
  alpacaCostume();
  const a = $('alpaca'); if (!a || !a.animate || document.hidden || a.dataset.busy) return;
  const bar = $('split-h'), clock = $('clock-pane'), r = Math.random();
  const para = S.project && bar && clock && bar.offsetParent && clock.offsetParent && clock.getBoundingClientRect().width > 0;
  a.dataset.busy = '1';
  const done = () => { a.style.display = 'none'; a.className = ''; delete a.dataset.busy; };
  (para && r < 0.34 ? alpacaParachute(a, bar, clock) : alpacaRun(a, r < 0.67 ? 'left' : 'right')).then(done, done);
}
const alpGo = (a, from, to, flip, ms, easing = 'ease-in-out') => a.animate(
  [{ transform: `translate(${from[0]}px, ${from[1]}px) scaleX(${flip})` }, { transform: `translate(${to[0]}px, ${to[1]}px) scaleX(${flip})` }],
  { duration: ms, easing, fill: 'forwards' }).finished;
// dobiega do 1/4 (z lewej) albo 3/4 (z prawej) szerokości ekranu, mruga i wraca
function alpacaRun(a, side) {
  const w = a.offsetWidth || 76, W = innerWidth;
  const off = side === 'left' ? -w - 10 : W + 10, mid = side === 'left' ? W / 4 - w / 2 : W * 3 / 4 - w / 2;
  const dir = side === 'left' ? 1 : -1, ms = Math.max(1800, Math.abs(mid - off) * 4.5);
  a.style.display = 'block'; a.className = 'run';
  return alpGo(a, [off, 0], [mid, 0], dir, ms)
    .then(() => { a.className = 'stop'; return new Promise(r => setTimeout(r, 1200)); })
    .then(() => { a.className = 'run'; return alpGo(a, [mid, 0], [off, 0], -dir, ms); });
}
// spadochron: start na belce nad zegarem, łagodne kołysanie w dół, po wylądowaniu ucieka w bok
function alpacaParachute(a, bar, clock) {
  alpacaCostume();
  const w = a.offsetWidth || 76, h = a.offsetHeight || 76, W = innerWidth;
  const br = bar.getBoundingClientRect(), cr = clock.getBoundingClientRect();
  const x = clamp(cr.left + cr.width / 2 - w / 2, 10, W - w - 10);
  const ground = innerHeight - 2 - h, ty0 = br.top - h * 0.35 - ground; // przesunięcie w górę od dołu ekranu
  a.style.display = 'block'; a.className = 'para';
  const fall = a.animate([
    { transform: `translate(${x}px, ${ty0}px) rotate(-7deg)` },
    { transform: `translate(${x + 14}px, ${ty0 * 0.66}px) rotate(7deg)` },
    { transform: `translate(${x - 10}px, ${ty0 * 0.33}px) rotate(-5deg)` },
    { transform: `translate(${x}px, 0px) rotate(0deg)` },
  ], { duration: Math.max(4200, -ty0 * 9), easing: 'ease-in-out', fill: 'forwards' }).finished;
  return fall
    .then(() => { a.className = 'stop'; return new Promise(r => setTimeout(r, 900)); })
    .then(() => {
      a.className = 'run';
      const right = x < W / 2 ? -1 : 1, to = right > 0 ? W + 10 : -w - 10;
      return alpGo(a, [x, 0], [to, 0], right, Math.max(1500, Math.abs(to - x) * 4));
    });
}
setTimeout(runAlpaca, 30000);
setInterval(runAlpaca, 5 * 60 * 1000);

// kliknięcie w przycisk / element (prawdziwy .click())
async function shClick(sel, ms) {
  const el = typeof sel === 'string' ? await shWaitFor(() => document.querySelector(sel)) : sel;
  if (!el) return null;
  const [x, y] = shCenter(el);
  await shMove(x, y, ms);
  await shWait(120); shRipple(); el.click(); await shWait(260);
  return el;
}
function shPtr(type, target, x, y, extra = {}) {
  target.dispatchEvent(new PointerEvent(type, { bubbles: true, cancelable: true, composed: true, clientX: x, clientY: y, pointerId: 1, pointerType: 'mouse', isPrimary: true,
    button: 0, buttons: type === 'pointerup' ? 0 : 1, ...extra }));
}
// klik w wizkę (tło) w punkcie znormalizowanym
async function shTapPhoto(pid, q) {
  const [x, y] = stageToClient(pid, q);
  await shMove(x, y, 800);
  await shWait(150); shRipple();
  if (S.selId) selectElement(null); // pierwsze kliknięcie obok zaznaczonego elementu tylko odznacza
  shPtr('pointerdown', viewer, x, y); shPtr('pointerup', viewer, x, y);
  await shWait(200);
}
// pisanie w polu
async function shType(input, text) {
  if (!input) return;
  const [x, y] = shCenter(input);
  await shMove(x, y, 450);
  shRipple(); input.focus({ preventScroll: true });
  input.value = ''; input.dispatchEvent(new Event('input', { bubbles: true }));
  // pole liczbowe nie przyjmuje „198." (czyści się) — część z kropką wpisujemy razem z następną cyfrą
  let cur = '';
  for (const ch of String(text)) {
    await shWait(SHOW_SPEED() < 1 ? 15 : 85);
    cur += ch;
    if (input.type === 'number' && /[.,]$/.test(cur)) continue;
    input.value = cur; input.dispatchEvent(new Event('input', { bubbles: true }));
  }
  if (input.value !== cur) { input.value = cur; input.dispatchEvent(new Event('input', { bubbles: true })); }
  await shWait(200);
}
function shKey(label) { // podpowiedź klawisza (np. Ctrl+V) przy kursorze
  const T = SH(); if (!T) return;
  const k = document.createElement('div'); k.className = 'show-key'; k.textContent = label;
  k.style.left = (T.cx + 18) + 'px'; k.style.top = (T.cy + 18) + 'px';
  document.body.appendChild(k); setTimeout(() => k.remove(), 1400);
}
const numTxt = mm => { const v = fromMM(mm); return String(v).replace('.', LANG === 'en' ? '.' : ','); };
const numInput = mm => String(fromMM(mm));
const unitWord = () => UNIT() === 'cm' ? TT('centymetrów', 'сантиметрів', 'centimetres') : TT('milimetrów', 'міліметрів', 'millimetres');

// obrys wielokątem: narzędzie ⬠, klik w każdy narożnik, na koniec w pierwszy punkt (zamyka obrys)
async function shDrawPoly(pid, pts) {
  if (S.selId) selectElement(null);
  await shClick('#toolbar [data-tool="poly"]', 650);
  const tap = async (q, ms) => {
    const [x, y] = stageToClient(pid, q);
    await shMove(x, y, ms); await shWait(90); shRipple();
    shPtr('pointerdown', viewer, x, y); shPtr('pointerup', viewer, x, y);
    await shWait(120);
  };
  for (const q of pts) await tap(q, 480);
  await tap(pts[0], 480);
  await shWait(250);
}
// przeciągnięcie znaku elementu (zostaje kreska ze strzałką do miejsca)
async function shDragLab(eid, lab, ms = 900) {
  const T = SH(); if (!T || !lab) return;
  const sel = `#overlay g.shp[data-eid="${eid}"] [data-part="lab"]`;
  const node = await shWaitFor(() => document.querySelector(sel), 3000);
  const el = S.elements.find(x => x.id === eid);
  if (!node || !el || !L.map[el.photoId]) return;
  const [x, y] = shCenter(node), [tx, ty] = stageToClient(el.photoId, lab);
  await shMove(x, y, 420); await shWait(100); shRipple();
  shPtr('pointerdown', node, x, y);
  T.onMove = (cx, cy) => shPtr('pointermove', viewer, cx, cy);
  try { await shMove(tx, ty, ms); } finally { T.onMove = null; }
  shPtr('pointerup', viewer, tx, ty);
  await shWait(250);
}
// odsunięcie znaku: z prawdziwej wizki (shape.lab), a gdy go tam nie ma — trochę w górę i w bok
function shLabOf(e) {
  if (e.shape && Array.isArray(e.shape.lab)) return e.shape.lab;
  const [cx, cy] = shapeCenter(e.shape);
  return [clamp(cx + (cx > 0.5 ? -0.05 : 0.05), 0.02, 0.98), clamp(cy - 0.08, 0.02, 0.98)];
}

// --- dodanie elementu przez menu łukowe, z komentarzem lektora ---
async function shAddElement(e, talk, first) {
  const t = typeById(e.typeId), v = (t.variants || []).find(x => x.id === e.variant);
  const pid = e.photoId, q = shapeCenter(e.shape);
  const label = tr(t.name);
  const poly = e.shape && e.shape.kind === 'poly' && Array.isArray(e.shape.pts) && e.shape.pts.length >= 3;
  if (talk && poly) await shSay(TT(`Teraz ${label}. Ten element obrysuję wielokątem: wybieram narzędzie Wielokąt i klikam kolejne narożniki, a na koniec pierwszy punkt.`,
    `Тепер ${label}. Цей елемент обведу багатокутником: обираю інструмент Багатокутник і клікаю кути по черзі, а наприкінці першу точку.`,
    `Now ${label}. I’ll outline this element with a polygon: I pick the Polygon tool, click the corners one by one and finally the first point.`));
  else if (talk) await shSay(first
    ? TT(`Pierwszy element: ${label}. Klikam miejsce na wizualizacji, gdzie ma być.`, `Перший елемент: ${label}. Клікаю місце на візуалізації, де він має бути.`, `First element: ${label}. I click the spot on the visual where it goes.`)
    : TT(`Teraz ${label}. Klikam jego miejsce.`, `Тепер ${label}. Клікаю його місце.`, `Now ${label}. I click its spot.`));
  if (poly) await shDrawPoly(pid, e.shape.pts); else await shTapPhoto(pid, q);
  if (!await shWaitFor(() => ARC && ARC.root.querySelector(`.arc-btn[data-t="${e.typeId}"]`))) return;
  await shWait(450);
  if (talk && first) await shSay(TT('Otwiera się menu z typami elementów. Wybieram typ.', 'Відкривається меню з типами елементів. Обираю тип.', 'A menu with element types opens. I pick the type.'));
  await shClick(`#arc .arc-btn[data-t="${e.typeId}"]`, 650);
  await shWait(350);
  if (v) {
    if (talk) await shSay(TT(`Wykonanie: ${tr(v.name)}.`, `Виконання: ${tr(v.name)}.`, `Variant: ${tr(v.name)}.`));
    await shClick(`#arc .ap-opt[data-step="v"][data-o="${v.id}"]`, 500); await shWait(250);
  }
  if (t.seg) {
    const o = e.wyslona && t.wyslona ? '2' : e.seg ? '1' : '0';
    if (talk) await shSay(o === '1' ? TT('Mocowanie: SEG, czyli tkanina na ramie aluminiowej. SEG nie ma spadu.', 'Кріплення: SEG, тобто тканина на алюмінієвій рамі. SEG без вильоту.', 'Mounting: SEG, fabric on an aluminium frame. SEG has no bleed.')
      : o === '2' ? TT('Mocowanie: wysłona.', `Кріплення: ${tr('Wysłona')}.`, `Mounting: ${tr('Wysłona')}.`) : TT('Mocowanie standardowe, ze spadem.', 'Стандартне кріплення, з вильотом.', 'Standard mounting, with bleed.'));
    await shClick(`#arc .ap-opt[data-step="s"][data-o="${o}"]`, 500); await shWait(250);
  }
  if (hasThick(e) && Number(e.thick) > 0) {
    if (talk) await shSay(TT(`Grubość ${e.thick} milimetrów.`, `Товщина ${e.thick} міліметрів.`, `Thickness ${e.thick} millimetres.`));
    await shType(await shWaitFor(() => document.querySelector('#arc input[data-f="thick"]')), String(e.thick));
  }
  for (const [k] of TYPE_TOGGLES) if (t[k] && e[k]) {
    if (talk) await shSay(k === 'laminate' ? TT('Z laminatem.', 'З ламінатом.', 'With laminate.') : TT('Z cięciem po konturze.', 'З порізкою по контуру.', 'Contour cut.'));
    await shClick(`#arc .ap-tog[data-tog="${k}"]`, 450);
  }
  if (t.finish && e.finish) await shClick(`#arc .ap-fin[data-fin="${e.finish}"]`, 450);
  const w = await shWaitFor(() => document.querySelector('#arc input[data-f="w"]'));
  if (talk) await shSay(TT(`Wpisuję wymiar widoczny: ${numTxt(e.w)} na ${numTxt(e.h)} ${unitWord()}.`, `Вписую видимий розмір: ${numTxt(e.w)} на ${numTxt(e.h)} ${unitWord()}.`, `I enter the visible size: ${numTxt(e.w)} by ${numTxt(e.h)} ${unitWord()}.`));
  await shType(w, numInput(e.w));
  if (dimsMode(e) === 'box') await shType(document.querySelector('#arc input[data-f="d"]'), numInput(e.d));
  await shType(document.querySelector('#arc input[data-f="h"]'), numInput(e.h));
  if ((Number(e.qty) || 1) > 1) await shType(document.querySelector('#arc input[data-f="qty"]'), String(e.qty));
  if (e.notes) await shType(document.querySelector('#arc input[data-f="notes"]'), e.notes);
  if (talk && first) {
    const calc = document.querySelector('#ap-calc');
    if (calc) { await shMove(...shCenter(calc), 500); }
    await shSay(TT('Wymiar do druku ze spadem i metry kwadratowe program liczy sam.', 'Розмір до друку з вильотом і квадратні метри програма рахує сама.', 'The print size with bleed and the square metres are calculated automatically.'));
  }
  if (talk) await shSay(TT('Dodaj.', 'Додати.', 'Add.'));
  const before = new Set(S.elements.map(x => x.id));
  await shClick('#arc .ap-go', 450);
  await shWaitFor(() => !ARC, 3000);
  if (tool !== 'point') { await shClick('#toolbar [data-tool="point"]', 450); }
  const added = await shWaitFor(() => S.elements.find(x => !before.has(x.id)), 3000);
  await shWait(250);
  if (added) {
    if (talk && first) await shSay(TT('Znak odsuwam trochę na bok, żeby nie zasłaniał wizualizacji. Zostaje kreska ze strzałką, która pokazuje dokładne miejsce.',
      'Позначку трохи відсуваю, щоб не закривала візуалізацію. Лишається лінія зі стрілкою, що показує точне місце.',
      'I move the mark a little aside so it doesn’t cover the visual. A line with an arrow shows the exact spot.'));
    await shDragLab(added.id, shLabOf(e), talk ? 900 : 500);
  }
}

async function startShow(pro = false) {
  if (S.tour || !S.me) return;
  if (pro && !isAdmin()) return;
  const byName = n => S.projects.find(x => String(x.name || '').trim().toLowerCase() === n);
  const src = (pro && (S.projects.find(x => x.id === PRO_PID) || byName(PRO_NAME))) || S.projects.find(x => x.id === TOUR_PID) || byName(TOUR_NAME);
  if (!src) { toast(TOUR_UI.missing, 'error'); return; }
  document.querySelectorAll('.menu').forEach(m => m.remove());
  while (modalStack.length) modalStack[modalStack.length - 1].close();
  // materiał pokazu: wizki i elementy prawdziwego stoiska (tylko odczyt)
  let photos, els;
  try { photos = await DB.list(pPhotos(src.id)); els = (await DB.list(pElements(src.id))).map(normalizeEl); }
  catch (e) { toast('Błąd bazy: ' + e.message, 'error'); return; }
  const allEls = clone(els); // PRO: całe stoisko 1:1 (drzwi, miniatury, odsunięte znaki)
  els = els.filter(e => e.shape && e.photoId && photos.some(p => p.id === e.photoId) && !e.doorFor)
    .sort((a, b) => (isWys(a) - isWys(b)) || (a.num || 0) - (b.num || 0));
  if (!photos.length || !els.length) { toast(TOUR_UI.missing, 'error'); return; }
  const proj = { ...clone(src), id: undefined, users: [S.me.id], photosCount: 0, elementsCount: 0, cover: '' };
  delete proj.id;
  const mem = createMemDB({ [C_PROJECTS]: { [SHOW_PID]: proj } });
  try { localStorage.removeItem(`INDEX_SEEN_${S.me.id}_${SHOW_PID}`); } catch (e) {}
  S.tour = { show: true, pro, allEls, pid: SHOW_PID, mem, prevPid: S.project ? S.project.id : null, prevView: S.elView, prevSide: S.sideSel, realDB: guardShowDB(DB), cx: innerWidth / 2, cy: innerHeight / 2 };
  DB = mem;
  // zdarzenia kursora pokazu nie mają prawdziwego wskaźnika — przechwycenie nie może rzucać błędem
  S.tour.spc = Element.prototype.setPointerCapture;
  Element.prototype.setPointerCapture = function (id) { try { return S.tour.spc.call(this, id); } catch (e) {} };
  S.tour.sideWas = sideState.open; S.tour.logWas = logState.open;
  // warstwy pokazu
  const block = document.createElement('div'); block.id = 'show-block';
  block.addEventListener('pointerdown', e => e.preventDefault()); block.addEventListener('wheel', e => e.preventDefault(), { passive: false });
  const cur = document.createElement('div'); cur.id = 'show-cursor';
  cur.innerHTML = `<svg viewBox="0 0 24 24" width="30" height="30"><path d="M4 2 L4 20 L9 15.5 L12.5 22.5 L15.5 21 L12 14 L19 14 Z" fill="#fff" stroke="#1a202c" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
  const cap = document.createElement('div'); cap.id = 'show-cap'; cap.setAttribute('data-noi18n', '');
  cap.innerHTML = `<div class="sc-h" title="${SHOW_UI.drag}"><span class="sc-dot"></span>${SHOW_UI.title}<span class="sc-grip">⠿</span><span class="sc-sp"></span>
      <span class="sc-st" id="show-st"></span>
      <button type="button" data-prev title="${SHOW_UI.prev}">⏮</button><button type="button" data-p title="${SHOW_UI.pause}">⏸</button><button type="button" data-next title="${SHOW_UI.next}">⏭</button>
      <button type="button" data-m title="${SHOW_UI.mute}">🔊</button><button type="button" data-x title="${SHOW_UI.close}">✕</button></div>
    <div class="sc-t" id="show-cap-t"></div><div class="sc-stages" id="show-stages"></div>`;
  document.body.append(block, cur, cap);
  shCursorAt(S.tour.cx, S.tour.cy);
  const T = S.tour;
  // przesuwanie okienka napisów za nagłówek
  const head = cap.querySelector('.sc-h');
  head.addEventListener('pointerdown', e => {
    if (e.button !== 0 || e.target.closest('button')) return;
    e.preventDefault();
    const r = cap.getBoundingClientRect(), dx = e.clientX - r.left, dy = e.clientY - r.top;
    try { head.setPointerCapture(e.pointerId); } catch (x) {}
    cap.classList.add('moving');
    const mv = ev => {
      cap.style.left = clamp(ev.clientX - dx, 0, innerWidth - r.width) + 'px';
      cap.style.top = clamp(ev.clientY - dy, 0, innerHeight - 50) + 'px';
      cap.style.bottom = 'auto'; cap.style.transform = 'none';
    };
    const up = () => { head.removeEventListener('pointermove', mv); head.removeEventListener('pointerup', up); head.removeEventListener('pointercancel', up); cap.classList.remove('moving'); };
    head.addEventListener('pointermove', mv); head.addEventListener('pointerup', up); head.addEventListener('pointercancel', up);
  });
  const setPause = p => { T.paused = p; cap.querySelector('[data-p]').textContent = p ? '▶' : '⏸'; cap.querySelector('[data-p]').title = p ? SHOW_UI.play : SHOW_UI.pause;
    if ('speechSynthesis' in window) { p ? speechSynthesis.pause() : speechSynthesis.resume(); } };
  cap.querySelector('[data-p]').onclick = () => setPause(!T.paused);
  cap.querySelector('[data-prev]').onclick = () => shJump((T.cur || 0) - 1);
  cap.querySelector('[data-next]').onclick = () => shJump((T.cur || 0) + 1);
  T.setPause = setPause;
  cap.querySelector('[data-m]').onclick = () => { T.muted = !T.muted; cap.querySelector('[data-m]').textContent = T.muted ? '🔇' : '🔊'; cap.querySelector('[data-m]').title = T.muted ? SHOW_UI.unmute : SHOW_UI.mute; if (T.muted && 'speechSynthesis' in window) speechSynthesis.cancel(); };
  cap.querySelector('[data-x]').onclick = () => { T.stop = true; endShow(); };
  T.keys = e => {
    if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); T.stop = true; endShow(); return; }
    if (e.key === ' ') { e.preventDefault(); e.stopPropagation(); setPause(!T.paused); return; }
    if (e.key === 'ArrowLeft') { e.preventDefault(); e.stopPropagation(); shJump((T.cur || 0) - 1); return; }
    if (e.key === 'ArrowRight') { e.preventDefault(); e.stopPropagation(); shJump((T.cur || 0) + 1); return; }
    e.preventDefault(); e.stopPropagation();
  };
  document.addEventListener('keydown', T.keys, true);
  // głos (lista głosów bywa pusta tuż po starcie)
  if ('speechSynthesis' in window) {
    speechSynthesis.cancel();
    T.voice = shVoice();
    if (!T.voice) { await new Promise(r => { const f = () => r(); speechSynthesis.addEventListener('voiceschanged', f, { once: true }); setTimeout(r, 1200); }); T.voice = shVoice(); }
  }
  if (!T.voice) toast(SHOW_UI.novoice, '', 5000);
  if (pro) cap.querySelector('.sc-h').firstChild.nextSibling.textContent = SHOW_UI.titlePro;
  try { await runShow(photos, els); }
  catch (e) { if (!(e instanceof ShowStop)) { console.error(e); toast('Pokaz przerwany: ' + e.message, 'error'); } }
  endShow();
}
// pasek etapów: klik w etap = przeskok; kropka jedzie razem z pokazem i można ją przeciągnąć w przód / w tył
function shStages() {
  const T = SH(); if (!T || !T.chapters) return;
  const box = $('show-stages'); if (!box) return;
  const n = T.chapters.length, cur = Math.min(T.cur || 0, n - 1);
  if (box.dataset.n !== String(n)) {
    box.dataset.n = n;
    box.innerHTML = `<div class="sc-segs">${T.chapters.map((c, i) => `<button type="button" data-k="${i}" title="${i + 1}. ${esc(c.name)}"><i></i><span>${esc(c.name)}</span></button>`).join('')}</div>
      <div class="sc-dot-wrap"><div class="sc-play" id="show-dot"><b id="show-dot-lab"></b></div></div>`;
    shScrubInit(box);
  }
  box.querySelectorAll('.sc-segs button').forEach((b, i) => { b.classList.toggle('done', i < (T.cur || 0)); b.classList.toggle('on', i === T.cur); });
  $('show-st').textContent = `${SHOW_UI.stage} ${cur + 1}/${n} · ${T.chapters[cur].name}`;
  shDot();
}
// pozycja kropki: początek etapu + szacowana część etapu, która już minęła (stoi w czasie pauzy)
function shDotPos() {
  const T = SH(); if (!T || !T.chapters) return 0;
  const n = T.chapters.length; if ((T.cur || 0) >= n) return 1;
  const c = T.chapters[T.cur || 0], est = (c.est || 15) * 1000 * (T.fast ? 0.5 : 1);
  return ((T.cur || 0) + Math.min(0.96, (T.chMs || 0) / est)) / n;
}
function shDot(pos) {
  const d = $('show-dot'); if (!d) return;
  d.style.left = ((pos == null ? shDotPos() : pos) * 100) + '%';
}
function shScrubInit(box) {
  const T = SH(); if (!T) return;
  const segs = box.querySelector('.sc-segs');
  const posAt = x => { const r = segs.getBoundingClientRect(); return clamp((x - r.left) / r.width, 0, 0.9999); };
  box.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    e.preventDefault();
    const S0 = SH(); if (!S0) return;
    S0.scrub = { x0: e.clientX, wasPaused: !!S0.paused, moved: false };
    box.setPointerCapture(e.pointerId);
    const mv = ev => {
      const sc = S0.scrub; if (!sc) return;
      if (!sc.moved && Math.abs(ev.clientX - sc.x0) < 4) return;
      if (!sc.moved) { sc.moved = true; if (!S0.paused && S0.setPause) S0.setPause(true); box.classList.add('scrub'); }
      const pos = posAt(ev.clientX), k = Math.floor(pos * S0.chapters.length);
      shDot(pos);
      $('show-dot-lab').textContent = `${k + 1}. ${S0.chapters[k].name}`;
      box.querySelectorAll('.sc-segs button').forEach((b, i) => b.classList.toggle('hov', i === k));
    };
    const up = ev => {
      box.removeEventListener('pointermove', mv); box.removeEventListener('pointerup', up); box.removeEventListener('pointercancel', up);
      const sc = S0.scrub; S0.scrub = null;
      box.classList.remove('scrub');
      box.querySelectorAll('.sc-segs button.hov').forEach(b => b.classList.remove('hov'));
      $('show-dot-lab').textContent = '';
      if (!sc) return;
      // klik albo puszczenie kropki = przeskok dokładnie w to miejsce: etap pod kursorem + przewinięcie w jego głąb
      const n = S0.chapters.length, pos = posAt(ev.clientX), k = Math.floor(pos * n), frac = pos * n - k;
      shDot(pos);
      shJump(k, frac > 0.04 ? frac * (S0.chapters[k].est || 15) * 1000 : 0);
    };
    box.addEventListener('pointermove', mv); box.addEventListener('pointerup', up); box.addEventListener('pointercancel', up);
  });
  // zegar kropki: czas w bieżącym etapie (bez pauz i przeciągania)
  let last = performance.now();
  T.dotTimer = setInterval(() => {
    const now = performance.now(), dt = now - last; last = now;
    const S1 = SH(); if (!S1) return;
    if (!S1.paused && !S1.scrub && !S1.rebuilding && !(S1.skip > 0)) S1.chMs = (S1.chMs || 0) + dt;
    if (!S1.scrub && !S1.rebuilding) shDot();
  }, 120);
}
function shJump(k, seekMs = 0) {
  const T = SH(); if (!T || !T.chapters) return;
  if (k < 0 || k >= T.chapters.length) return;
  T.jumpTo = k; T.seekMs = seekMs;
  if (T.paused && T.setPause) T.setPause(false);
  if ('speechSynthesis' in window) speechSynthesis.cancel();
}

// czyszczenie po przerwanym etapie (menu, okna, przeciąganie, panele, podświetlenia)
function shCleanup() {
  const T = SH(); if (!T) return;
  closeArcMenu(true);
  while (modalStack.length) modalStack[modalStack.length - 1].close();
  T.onMove = null; T.fast = false; liveShape = null; act = null;
  if (S.turbo) endTurbo();
  document.querySelectorAll('.menu').forEach(m => m.remove());
  const thr = $('thread-svg'); if (thr) thr.remove();
  if (assignTo) cancelAssign();
  cancelDraft(); if (tool !== 'point') setTool('point');
  if (S.graphMove) toggleGraphMove(false);

async function shRebuildTo(k) {
  const T = SH(); if (!T) return;
  shCleanup();
  T.inst = { num: 0, w: 0 };
  T.mem.wipe(C_PROJECTS);
  setElView('table');
  await plainUntil(() => !S.photos.length && !S.elements.length, 3000);
  if (T.setup) { await T.setup(); await shSettle(); }
  for (let j = 0; j < k; j++) if (T.chapters[j].instant) { await T.chapters[j].instant(); await shSettle(); }
  const nP = T.mem.count(pPhotos(SHOW_PID)), nE = T.mem.count(pElements(SHOW_PID));
  await plainUntil(() => S.photos.length === nP && S.elements.length === nE, 4000);
  if (nP) await plainUntil(() => { const im = [...document.querySelectorAll('#stage-imgs img')]; return im.length && im.every(i => i.complete && i.naturalWidth); }, 6000);
  fitView();
  if (S.elView === 'graph') { await plainWait(150); graphFit(); }
  await plainWait(200);
}
async function runShow(photos, els) {
  const T = S.tour;

  if (T.setup) { await T.setup(); await shSettle(); }
  shStages();

  let i = 0;
  while (i < T.chapters.length) {
    try {
      T.cur = i; T.chMs = 0; T.namedAt = -1; T.skip = T.seekMs || 0; T.seekMs = 0; shStages();
      await T.chapters[i].run();

      if (T.seekMs) shDot((k + Math.min(0.96, T.seekMs / ((T.chapters[k].est || 15) * 1000))) / T.chapters.length);
      try { await shRebuildTo(k); } finally { T.rebuilding = false; }
      if (!SH() || SH().stop) throw new ShowStop();
      i = k;
    }
  }
  T.cur = T.chapters.length; shStages(); shDot(1);
}
// =====================================================================
//  STOISKO ĆWICZENIOWE: kopia stoiska „GOG testy” (wizki + elementy) w pamięci przeglądarki.
//  Można wszystko klikać, dodawać i usuwać — nic nie trafia do bazy; „Zacznij od nowa” wraca do kopii.
// =====================================================================
async function startPractice() {
  if (S.tour || S.practice || !S.me) return;
  const src = S.projects.find(x => x.id === TOUR_PID) || S.projects.find(x => String(x.name || '').trim().toLowerCase() === TOUR_NAME);
  if (!src) { toast(TOUR_UI.missing, 'error'); return; }
  document.querySelectorAll('.menu').forEach(m => m.remove());
  while (modalStack.length) modalStack[modalStack.length - 1].close();
  let photos, els;
  try { photos = await DB.list(pPhotos(src.id)); els = await DB.list(pElements(src.id)); }
  catch (e) { toast('Błąd bazy: ' + e.message, 'error'); return; }
  const byId = list => Object.fromEntries(list.map(x => { const o = clone(x); delete o.id; return [x.id, o]; }));
  const proj = { ...clone(src), name: SHOW_UI.menuPractice, users: [S.me.id], team: [] };
  delete proj.id;
  const seed = { [C_PROJECTS]: { [PRACT_PID]: proj }, [pPhotos(PRACT_PID)]: byId(photos), [pElements(PRACT_PID)]: byId(els) };
  S.practice = { seed, realDB: guardShowDB(DB), prevPid: S.project ? S.project.id : null };
  DB = createMemDB(seed);
  try { localStorage.removeItem(`INDEX_SEEN_${S.me.id}_${PRACT_PID}`); } catch (e) {}
  let bar = $('practice-bar');
  if (!bar) {
    bar = document.createElement('div'); bar.id = 'practice-bar'; bar.setAttribute('data-noi18n', '');
    bar.innerHTML = `<b>🎓 ${SHOW_UI.practiceBar}</b><button class="btn btn-sm" data-r>↺ ${SHOW_UI.practiceReset}</button><button class="btn btn-sm btn-solid" data-x>${SHOW_UI.practiceEnd}</button>`;
    document.body.appendChild(bar);
    bar.querySelector('[data-r]').onclick = () => { if (!S.practice) return; DB = createMemDB(S.practice.seed); openProject(PRACT_PID); toast(SHOW_UI.practiceReset + ' ✓', 'success'); };
    bar.querySelector('[data-x]').onclick = () => endPractice(true);
  }
  await openProject(PRACT_PID);
}
function endPractice(nav = true) {
  const P = S.practice; if (!P) return;
  while (modalStack.length) modalStack[modalStack.length - 1].close();
  if (S.turbo) endTurbo();
  DB = P.realDB;
  S.practice = null;
  const bar = $('practice-bar'); if (bar) bar.remove();
  try { localStorage.removeItem(`INDEX_SEEN_${S.me.id}_${PRACT_PID}`); } catch (e) {}
  if (!nav) return;
  if (P.prevPid && P.prevPid !== PRACT_PID) openProject(P.prevPid);
  else goHome();
}

function endShow() {
  const T = S.tour; if (!T || !T.show) return;
  T.stop = true;
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  closeArcMenu(true);
  while (modalStack.length) modalStack[modalStack.length - 1].close();
  document.removeEventListener('keydown', T.keys, true);
  clearInterval(T.dotTimer);
  ['show-block', 'show-cursor', 'show-cap'].forEach(id => { const e = $(id); if (e) e.remove(); });
  document.querySelectorAll('.show-ripple, .show-key').forEach(e => e.remove());
  if (T.spc) Element.prototype.setPointerCapture = T.spc;
  if (S.graphMove) toggleGraphMove(false);
  S.graphBusy = false;
  $('clock-pane').classList.remove('show-hl');
  toggleSide(T.sideWas); toggleLog(T.logWas);
  liveShape = null; act = null;
  if (S.turbo) endTurbo();
  document.querySelectorAll('.menu').forEach(m => m.remove());
  try { localStorage.removeItem(`INDEX_SEEN_${S.me.id}_${SHOW_PID}`); } catch (e) {}
  DB = T.realDB;
  S.tour = null;
  if (S.elView !== T.prevView) setElView(T.prevView);
  S.sideSel = T.prevSide;
  if (T.prevPid) openProject(T.prevPid);
  else { goHome(); history.replaceState(null, '', location.pathname + (MODE_QS ? '?' + MODE_QS : '')); renderSide(); }
}

window.addEventListener('load', async () => {
  if (DEMO) {
    DB = LocalDB;
    const b = document.createElement('div'); b.className = 'demo-badge'; b.textContent = 'TRYB DEMO — dane tylko w tej przeglądarce';
    document.body.appendChild(b);
  } else {
    if (TEST) {
      const b = document.createElement('div'); b.className = 'demo-badge'; b.textContent = 'PIASKOWNICA — kolekcje testowe (zztest), prawdziwe dane nietknięte';
      document.body.appendChild(b);
    }
    try {
      if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
      db = firebase.firestore();
      DB = FireDB;
    } catch (e) {
      $('login-err').textContent = 'Brak połączenia z bazą: ' + e.message;
      return;
    }
  }
  $('login-btn').disabled = true;
  await reloadUsers();
  $('login-btn').disabled = false;
  DB.sub(C_USERS, rows => {
    S.users = mergeUsers(rows);
    if (S.me) { const me = userById(S.me.id); if (me) { S.me = me; renderMyAvatar(); } refreshPresence(); }
    else renderLoginAvatars();
  });
  // zapamiętana sesja
  try {
    const sess = JSON.parse(localStorage.getItem('INDEX_SESSION') || 'null');
    const u = sess && userById(sess.id);
    if (u && u.passHash && u.passHash === sess.h) return enterApp(u);
  } catch (e) {}
  showScreen('screen-login');
  renderLoginAvatars();
});
