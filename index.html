function openUsersPanel() {
  const m = openModal({ title: '👥 Użytkownicy INDEX', wide: true, body: '<div id="up-body"></div>',
    footer: '<button class="btn" data-c>Zamknij</button>' });
  m.el.querySelector('[data-c]').onclick = () => m.close();
  const render = () => {
    $('up-body').innerHTML = `
      <table class="adm-t"><thead><tr><th></th><th>Login</th><th>Imię i nazwisko</th><th>Firma / agencja</th><th>Rola</th><th>Hasło</th><th></th></tr></thead>
      <tbody>${S.users.map(u => `<tr>
        <td><span class="avatar-sm" style="background:${u.color}">${esc(u.login.slice(0, 3))}</span></td>
        <td><b>${esc(u.login)}</b></td><td>${esc(u.name || '')}</td><td>${esc(u.company || '')}</td>
        <td>${u.admin ? '👑 administrator' : 'użytkownik'}</td>
        <td>${u.passHash ? '✓ ustawione' : '<span class="tag-warn">brak — konto nieaktywne</span>'}</td>
        <td style="white-space:nowrap;text-align:right">
          <button class="btn btn-sm" data-pass="${u.id}">Ustaw hasło</button>
          ${FIXED_ADMINS.includes(u.id) || u.id === 'test' ? '' : `<button class="btn btn-sm btn-red" data-del="${u.id}">Usuń</button>`}</td>
      </tr>`).join('')}</tbody></table>
      <h4 style="margin:20px 0 10px;font-size:.9rem">Nowe konto (np. dla agencji)</h4>
      <div class="row2">
        <div class="fld"><label>Login *</label><input type="text" id="nu-login" placeholder="np. anna.agencja" autocapitalize="off"></div>
        <div class="fld"><label>Hasło * (min. 6 znaków)</label><input type="text" id="nu-pass" autocomplete="off"></div>
      </div>
      <div class="row2">
        <div class="fld"><label>Imię i nazwisko</label><input type="text" id="nu-name"></div>
        <div class="fld"><label>Firma / agencja</label><input type="text" id="nu-company"></div>
      </div>
      <button class="btn btn-solid" id="nu-add">Dodaj konto</button>
      <div class="hint" style="margin-top:8px;font-size:.75rem;color:var(--gray)">Nowe konto nie widzi żadnego projektu, dopóki nie zaznaczysz go w ustawieniach projektu (⚙ Projekt → Dostęp dla).</div>`;
    $('up-body').querySelectorAll('[data-pass]').forEach(b => b.onclick = () => setUserPassword(b.dataset.pass, render));
    $('up-body').querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
      const u = userById(b.dataset.del);
      if (!await confirmBox(`Usunąć konto <b>${esc(u.login)}</b>? Wpisy w historii zostaną.`, 'Usuń')) return;
      await DB.del(C_USERS, u.id); await reloadUsers(); render();
    });
    $('nu-add').onclick = async () => {
      const login = $('nu-login').value.trim(), pass = $('nu-pass').value;
      if (!/^[\w.\-]{2,30}$/.test(login)) return toast('Login: 2–30 znaków, litery bez ogonków, cyfry, kropka, myślnik', 'error');
      if (userById(login.toLowerCase())) return toast('Taki login już istnieje', 'error');
      if (pass.length < 6) return toast('Hasło: minimum 6 znaków', 'error');
      const id = login.toLowerCase();
      await DB.set(C_USERS, id, { login, name: $('nu-name').value.trim(), company: $('nu-company').value.trim(), admin: false,
        color: USER_COLORS[S.users.length % USER_COLORS.length], passHash: await passHashOf(id, pass), createdAt: nowIso(), createdBy: S.me.id });
      await reloadUsers(); render();
      toast(`Konto ${login} utworzone — przekaż login i hasło osobie z agencji`, 'success', 5000);
    };
  };
  render();
}
function setUserPassword(id, after) {
  const u = userById(id);
  const m = openModal({ title: 'Hasło dla ' + esc(u.login), body: `<div class="fld"><label>Nowe hasło (min. 6 znaków)</label><input type="text" id="sp-pass" autocomplete="off"></div>`,
    footer: '<button class="btn" data-c>Anuluj</button><button class="btn btn-solid" id="sp-ok">Zapisz</button>' });
  m.el.querySelector('[data-c]').onclick = () => m.close();
  $('sp-ok').onclick = async () => {
    const p = $('sp-pass').value;
    if (p.length < 6) return toast('Minimum 6 znaków', 'error');
    await DB.set(C_USERS, id, { login: u.login, name: u.name || '', company: u.company || '', admin: !!u.admin, color: u.color, passHash: await passHashOf(id, p) }, true);
    await reloadUsers();
    if (S.me.id === id) S.me = userById(id);
    m.close(); toast('Hasło ustawione', 'success'); after && after();
  };
}
async function reloadUsers() {
  try { S.users = mergeUsers(await DB.list(C_USERS)); } catch (e) { S.users = mergeUsers([]); toast('Nie udało się wczytać użytkowników: ' + e.message, 'error'); }
}

function openTypesPanel() {
  const m = openModal({ title: '🏷️ Typy elementów', wide: true, body: '<div id="tp-body"></div>',
    footer: '<button class="btn" id="tp-add" style="margin-right:auto">+ Nowy typ</button><button class="btn" data-c>Zamknij</button>' });
  m.el.querySelector('[data-c]').onclick = () => m.close();
  const render = () => {
    $('tp-body').innerHTML = `<div class="hint" style="font-size:.78rem;color:var(--gray);margin-bottom:10px">Kolor = kolor obwódki na wizce i w PDF. Spad dodawany automatycznie z każdej strony.
      Przykładowe zdjęcie zobaczy agencja przy wyborze typu — kliknij miniaturę, aby je wgrać.</div>
      <table class="adm-t"><thead><tr><th>Kol.</th><th>Nazwa</th><th>Opis dla agencji</th><th>Spad [mm]</th><th>Przykład</th><th>Kolej.</th><th></th></tr></thead>
      <tbody>${S.types.map(t => `<tr data-id="${t.id}">
        <td><input type="color" data-f="color" value="${esc(t.color)}"></td>
        <td style="min-width:170px"><input type="text" data-f="name" value="${esc(t.name)}"></td>
        <td style="min-width:240px"><input type="text" data-f="desc" value="${esc(t.desc || '')}"></td>
        <td style="width:80px"><input type="number" data-f="bleed" min="0" value="${esc(t.bleed || 0)}"></td>
        <td><div class="ex-thumb" data-ex style="${t.example ? `background-image:url('${esc(thumbUrl(t.example, 130, 90))}')` : ''}">${t.example ? '' : 'wgraj<br>zdjęcie'}</div></td>
        <td style="width:64px"><input type="number" data-f="order" value="${esc(t.order || 0)}"></td>
        <td style="white-space:nowrap"><button class="btn btn-sm btn-green" data-save>Zapisz</button>
          ${t.id === 'nie-wiem' ? '' : '<button class="btn btn-sm btn-red" data-del>✕</button>'}</td></tr>`).join('')}</tbody></table>`;
    $('tp-body').querySelectorAll('tr[data-id]').forEach(tr => {
      const id = tr.dataset.id;
      const val = () => {
        const o = {}; tr.querySelectorAll('[data-f]').forEach(i => o[i.dataset.f] = i.type === 'number' ? Number(i.value) || 0 : i.value.trim());
        return o;
      };
      tr.querySelector('[data-save]').onclick = async () => {
        await ensureTypesSeeded();
        const t = S.types.find(x => x.id === id) || {};
        await DB.set(C_TYPES, id, { ...t, ...val(), id: undefined });
        toast('Zapisano typ', 'success');
      };
      const del = tr.querySelector('[data-del]');
      if (del) del.onclick = async () => {
        const used = S.elements.filter(e => e.typeId === id).length;
        if (!await confirmBox('Usunąć ten typ?' + (used ? ` W bieżącym projekcie używa go ${used} el.` : ''), 'Usuń')) return;
        await ensureTypesSeeded(); await DB.del(C_TYPES, id); setTimeout(render, 100);
      };
      tr.querySelector('[data-ex]').onclick = () => {
        const fi = $('file-generic');
        fi.onchange = async () => {
          const f = fi.files[0]; fi.value = ''; if (!f) return;
          const tt = toast('Wgrywanie zdjęcia…', '', 60000);
          try {
            const { url } = await storeImage(f, 1200);
            await ensureTypesSeeded();
            await DB.set(C_TYPES, id, { example: url }, true);
            setTimeout(render, 150);
          } catch (e) { toast('Błąd: ' + e.message, 'error'); }
          tt.remove();
        };
        fi.click();
      };
    });
  };
  $('tp-add').onclick = async () => {
    await ensureTypesSeeded();
    await DB.set(C_TYPES, 'typ-' + uid(), { name: 'Nowy typ', color: '#3182ce', bleed: 10, desc: '', order: 50, icon: 'print' });
    setTimeout(render, 150);
  };
  render();
}

window.addEventListener('load', async () => {
  if (DEMO) {
    DB = LocalDB;
    const b = document.createElement('div'); b.className = 'demo-badge'; b.textContent = 'TRYB DEMO — dane tylko w tej przeglądarce';
    document.body.appendChild(b);
  } else {
    try {
      if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
      db = firebase.firestore();
      DB = FireDB;
    } catch (e) {
      $('login-err').textContent = 'Brak połączenia z bazą: ' + e.message;
      return;
    }
  }
  $('login-btn').disabled = true;
  await reloadUsers();
  $('login-btn').disabled = false;
  DB.sub(C_USERS, rows => {
    S.users = mergeUsers(rows);
    if (S.me) { const me = userById(S.me.id); if (me) { S.me = me; renderMyAvatar(); } }
    else renderLoginAvatars();
  });
  // zapamiętana sesja
  try {
    const sess = JSON.parse(localStorage.getItem('INDEX_SESSION') || 'null');
    const u = sess && userById(sess.id);
    if (u && u.passHash && u.passHash === sess.h) return enterApp(u);
  } catch (e) {}
  showScreen('screen-login');
  renderLoginAvatars();
});
</script>
