// przepisuje do elementu dane wybranego eksponatu / kompletu / grupy; zwraca linijkę do uwag
function axApplyPick(el, pick) {
  axClearPick(el);
  const items = pick.kind === 'rec' ? [pick.rec] : pick.cont.items, r0 = items[0];
  if (pick.kind === 'rec') Object.assign(el, { archiwumId: r0.id, archiwumNo: r0.number || '' });
  else Object.assign(el, { archiwumKind: pick.kind, archiwumName: pick.cont.name, archiwumTag: pick.cont.fullTag || pick.cont.tag,
    archiwumIds: items.map(r => r.id), archiwumNos: items.map(r => r.number || '') });
  const v = axVariant(r0); if (v) el.variant = v;
  // komplet z kilku części nie ma jednego wymiaru — wymiary części idą do uwag
  const oneDim = pick.kind !== 'set' || items.length === 1;
  if (oneDim) { el.w = axMM(r0, r0.width); el.h = axMM(r0, r0.height); if (axMM(r0, r0.thickness)) el.thick = axMM(r0, r0.thickness); }
  el.qty = pick.kind === 'group' ? items.length : 1;
  const img = pick.kind === 'rec' ? axPhoto(r0) : pick.cont.image;
  if (img) { el.thumb = img; el.axThumb = true; }
  const head = pick.kind === 'rec' ? `${r0.company || '—'} #${r0.number || '?'}` : `${pick.cont.title} ${pick.cont.fullTag || ''}`.trim();
  if (!el.name) el.name = head;
  return `Archiwum X: ${head}` + (pick.kind === 'rec' ? '' : ` (${pick.kind === 'set' ? 'komplet' : 'grupa'}: ` + items.map(r => '#' + r.number + (axDimTxt(r) ? ' ' + axDimTxt(r) : '')).join(', ') + ')');
}

// nitka: od przycisku 🧵 do kursora; puszczona na wizce = pierwsze miejsce elementu
document.addEventListener('pointerdown', ev => {
  const b = ev.target.closest && ev.target.closest('[data-thread]');
  if (!b || ev.button !== 0) return;
  ev.preventDefault(); ev.stopPropagation();
  const eid = b.dataset.thread, r0 = b.getBoundingClientRect(), x0 = r0.left + r0.width / 2, y0 = r0.top + r0.height / 2;
  const el = S.elements.find(e => e.id === eid); if (!el) return;
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.id = 'thread-svg';
  svg.innerHTML = `<path id="thr-p" fill="none" stroke="${typeById(el.typeId).color}" stroke-width="3" stroke-dasharray="7 4"/><circle id="thr-c" r="9" fill="${typeById(el.typeId).color}" stroke="#fff" stroke-width="2"/><text id="thr-t" font-size="11" font-weight="800" fill="#fff" text-anchor="middle" dy="4">${esc(markOf(el))}</text>`;
  document.body.appendChild(svg);
  const move = e => {
    const x = e.clientX, y = e.clientY, sag = Math.min(120, Math.hypot(x - x0, y - y0) * 0.25);
    svg.querySelector('#thr-p').setAttribute('d', `M${x0} ${y0} Q${(x0 + x) / 2} ${(y0 + y) / 2 + sag} ${x} ${y}`);
    ['thr-c', 'thr-t'].forEach(i => { const n = svg.querySelector('#' + i); n.setAttribute(i === 'thr-c' ? 'cx' : 'x', x); n.setAttribute(i === 'thr-c' ? 'cy' : 'y', y); });
    const vr = viewer.getBoundingClientRect(), on = x >= vr.left && x <= vr.right && y >= vr.top && y <= vr.bottom && !!photoAt(...toStage(e));
    svg.classList.toggle('ok', on);
  };
  const up = async e => {
    document.removeEventListener('pointermove', move); document.removeEventListener('pointerup', up);
    svg.remove();
    const vr = viewer.getBoundingClientRect();
    if (e.clientX < vr.left || e.clientX > vr.right || e.clientY < vr.top || e.clientY > vr.bottom) return;
    const [sx, sy] = toStage(e), pid = photoAt(sx, sy);
    if (!pid) return toast('Upuść nitkę na wizce', 'error');
    await addLocation(eid, pid, { kind: 'point', pts: [normIn(pid, sx, sy)] });
    toast(`${markOf(el)} zaznaczony na wizce #${photoNo(pid)}`, 'success');
  };
  move(ev);
  document.addEventListener('pointermove', move); document.addEventListener('pointerup', up);
}, true);

  if ((a.qty || 1) !== (b.qty || 1)) ch.push(`ilość ${a.qty || 1} → ${b.qty || 1}`);
  if ((a.name || '') !== (b.name || '')) ch.push(`opis „${b.name || '—'}"`);

  if (bleedOf(a) !== bleedOf(b)) ch.push(`spad → ${bleedTxt(bleedOf(b))}`);

    const card = h.closest('.gc'), eid = h.dataset.eid;
    h.ondblclick = () => openElementDialog({ id: eid });
    h.onclick = () => { if (!S.graphMove) selectElement(eid); };
    // w trybie „Przesuń" okienko łapie się w dowolnym miejscu: nazwa, prostokąt, wymiary, miniatura
    // (środkowy przycisk zostaje dla przesuwania widoku — obsługuje go #el-scroll)
    card.onpointerdown = e => {
      if (e.button !== 0 || !S.graphMove || e.target.closest('.gc-ed')) return;
      e.preventDefault(); e.stopPropagation();
      card.setPointerCapture(e.pointerId);
      S.graphBusy = true; // w trakcie żadnych przerysowań — inaczej okienko „wypada" spod kursora
      const x0 = e.clientX, y0 = e.clientY, l0 = card.offsetLeft, t0 = card.offsetTop;
      let moved = false, items = [], raf = 0, last = null;
      // pozostałe okienka: pozycje z chwili chwycenia (do nich wracają, gdy zrobi się miejsce)
      const others = [...card.parentElement.querySelectorAll('.gc')].filter(c => c !== card)
        .map(c => ({ c, id: c.dataset.eid, hx: c.offsetLeft, hy: c.offsetTop, w: c.offsetWidth, h: c.offsetHeight }));
      const GAP = 24, mw = card.offsetWidth, mh = card.offsetHeight;
      const hit = (a, b) => a.x < b.x + b.w + GAP && b.x < a.x + a.w + GAP && a.y < b.y + b.h + GAP && b.y < a.y + a.h + GAP;
      // odsuwa okienko m od przeszkody o — najkrótszą drogą, ale wolimy na bok niż w górę / w dół
      const push = (m, o) => {
        const opts = [[o.x + o.w + GAP - m.x, 0, 1], [-(m.x + m.w + GAP - o.x), 0, 1], [0, o.y + o.h + GAP - m.y, 1.8], [0, -(m.y + m.h + GAP - o.y), 1.8]]
          .filter(([dx, dy]) => m.x + dx >= 0 && m.y + dy >= 0)
          .sort((a, b) => (Math.abs(a[0]) + Math.abs(a[1])) * a[2] - (Math.abs(b[0]) + Math.abs(b[1])) * b[2]);
        const [dx, dy] = opts[0] || [o.x + o.w + GAP - m.x, 0];
        m.x += dx; m.y += dy; m.pushed = true;
      };
      const makeRoom = (dx0, dy0) => {
        const drag = { x: dx0, y: dy0, w: mw, h: mh };
        const list = others.map(o => ({ ...o, x: o.hx, y: o.hy, pushed: false }));
        for (let pass = 0; pass < 40; pass++) {
          let any = false;
          for (const m of list) if (hit(m, drag)) { push(m, drag); any = true; }
          for (let i = 0; i < list.length; i++) for (let j = i + 1; j < list.length; j++) {
            const a = list[i], b = list[j];
            if (!hit(a, b)) continue;
            const m = a.pushed && !b.pushed ? b : !a.pushed && b.pushed ? a : b;
            push(m, m === a ? b : a); any = true;
          }
          if (!any) break;
        }
        list.forEach(it => { it.c.style.left = it.x + 'px'; it.c.style.top = it.y + 'px'; });
        return list;
      };
      // ruch liczony raz na klatkę obrazu (requestAnimationFrame) — płynnie nawet przy wielu okienkach
      const frame = () => {
        raf = 0; if (!last) return;
        const dx = (last.x - x0) / G.s, dy = (last.y - y0) / G.s;
        const nx = Math.max(0, l0 + dx), ny = Math.max(0, t0 + dy);
        card.style.left = nx + 'px'; card.style.top = ny + 'px';
        items = makeRoom(nx, ny);
        fitWrap();
      };
      const mv = ev => {
        if (!moved && Math.hypot(ev.clientX - x0, ev.clientY - y0) < 4) return;
        if (!moved) { moved = true; card.classList.add('dragging'); card.parentElement.classList.add('sorting'); }
        last = { x: ev.clientX, y: ev.clientY };
        if (!raf) raf = requestAnimationFrame(frame);
      };
      const up = async () => {
        card.removeEventListener('pointermove', mv); card.removeEventListener('pointerup', up); card.removeEventListener('pointercancel', up);
        if (raf) { cancelAnimationFrame(raf); frame(); }
        card.classList.remove('dragging');
        if (!moved) { S.graphBusy = false; if (S.graphDirty) renderElements(); selectElement(eid); return; }
        // zapis: przeciągnięte okienko i wszystkie, które się rozjechały — jedno przerysowanie na końcu
        const changes = [{ id: eid, gpos: { x: Math.round(parseFloat(card.style.left)), y: Math.round(parseFloat(card.style.top)) } }]
          .concat(items.filter(it => it.x !== it.hx || it.y !== it.hy).map(it => ({ id: it.id, gpos: { x: Math.round(it.x), y: Math.round(it.y) } })));
        await new Promise(r => setTimeout(r, 240)); // niech rozjeżdżanie się skończy
        await saveGpos(changes);
      };
      card.addEventListener('pointermove', mv); card.addEventListener('pointerup', up); card.addEventListener('pointercancel', up);
    };
  });
  box.querySelectorAll('.gc-frame').forEach(f => {
    const eid = f.dataset.eid;
    f.onclick = e => {
      if (S.graphMove) return; // w trybie przesuwania klik nie wkleja grafiki
      const rm = e.target.closest('[data-rm]');
      if (rm) { e.stopPropagation(); removeThumb(eid); return; }
      e.stopPropagation(); pasteThumb(eid);
    };
    f.addEventListener('dragover', e => { if (hasFiles(e)) { e.preventDefault(); f.classList.add('drag'); } });
    f.addEventListener('dragleave', () => f.classList.remove('drag'));
    f.addEventListener('drop', e => {
      f.classList.remove('drag');
      if (!hasFiles(e)) return;
      e.preventDefault(); e.stopPropagation();
      const file = [...e.dataTransfer.files].find(x => x.type.startsWith('image/'));
      if (file) setThumb(eid, file);
    });
  });
}

async function pasteThumb(eid) {

  if (!navigator.clipboard || !navigator.clipboard.read) return pickThumbFile(eid);

      const type = item.types.find(t => t.startsWith('image/'));
      if (type) { const b = await item.getType(type); return setThumb(eid, new File([b], 'grafika.' + (type.split('/')[1] || 'png'), { type })); }
    }
    toast('W schowku nie ma obrazka — wybierz plik z dysku', '', 3500);

// Wyrównaj: okienka zostają mniej więcej tam, gdzie je postawiono, ale nachodzące
// na siebie rozsuwamy (w prawo albo w dół — krótszą drogą) na równy odstęp
async function graphAlign() {
  const GAP = 28;
  const cards = [...document.querySelectorAll('#el-scroll .gc')].map(c => ({ id: c.dataset.eid, x: c.offsetLeft, y: c.offsetTop, w: c.offsetWidth, h: c.offsetHeight }));
  if (!cards.length) return;
  // wiersze: okienka, których góry są blisko siebie, ustawiamy na jednej wysokości
  cards.sort((a, b) => a.y - b.y || a.x - b.x);
  for (let i = 1; i < cards.length; i++) {
    const prev = cards[i - 1];
    if (Math.abs(cards[i].y - prev.y) < 30) cards[i].y = prev.y;
  }
  const hits = (a, b) => a.x < b.x + b.w + GAP && b.x < a.x + a.w + GAP && a.y < b.y + b.h + GAP && b.y < a.y + a.h + GAP;
  cards.sort((a, b) => a.y - b.y || a.x - b.x);
  for (let pass = 0; pass < 60; pass++) {
    let moved = false;
    for (let i = 0; i < cards.length; i++) for (let j = 0; j < i; j++) {
      const a = cards[j], b = cards[i];
      if (!hits(a, b)) continue;
      const pushX = a.x + a.w + GAP - b.x, pushY = a.y + a.h + GAP - b.y;
      if (pushX <= pushY) b.x += pushX; else b.y += pushY;
      moved = true;
    }
    if (!moved) break;
  }
  // całość dosunięta do lewego górnego rogu
  const minX = Math.min(...cards.map(c => c.x)), minY = Math.min(...cards.map(c => c.y));
  await saveGpos(cards.map(c => ({ id: c.id, gpos: { x: Math.round(c.x - minX + 16), y: Math.round(c.y - minY + 12) } })) // margines jak w układzie automatycznym
    .filter(ch => { const el = S.elements.find(x => x.id === ch.id); return !(el && el.gpos && el.gpos.x === ch.gpos.x && el.gpos.y === ch.gpos.y); }));
}
// widok „Grafika": powiększenie i przesunięcie jak przy wizkach
const G = { s: 1, tx: 0, ty: 0, key: null, panned: false };
function applyGraphView() {
  const st = $('gstage'); if (st) st.style.transform = `translate(${G.tx}px,${G.ty}px) scale(${G.s})`;
}
function graphZoomAt(cx, cy, f) {
  const r = $('el-scroll').getBoundingClientRect(), px = cx - r.left, py = cy - r.top;
  const ns = clamp(G.s * f, 0.2, 4), k = ns / G.s;
  G.tx = px - (px - G.tx) * k; G.ty = py - (py - G.ty) * k; G.s = ns;
  applyGraphView();
}
function graphFit() {
  const box = $('el-scroll'), w = box.querySelector('.gidx'); if (!w) return;
  const bw = box.clientWidth, bh = box.clientHeight, ww = w.offsetWidth, wh = w.offsetHeight;
  G.s = clamp(Math.min((bw - 20) / ww, (bh - 20) / wh), 0.2, 1.5);
  G.tx = Math.max(10, (bw - ww * G.s) / 2); G.ty = 10;
  applyGraphView();
}
(function graphNav() {
  const box = $('el-scroll');
  box.addEventListener('wheel', e => {
    if (S.elView !== 'graph' || !box.querySelector('#gstage')) return;
    e.preventDefault();
    const d = e.deltaMode === 1 ? e.deltaY * 30 : e.deltaY;
    graphZoomAt(e.clientX, e.clientY, Math.pow(1.0018, -d));
  }, { passive: false });
  // przeciągnięcie tła (albo okienka poza trybem „Przesuń") przesuwa widok; krótkie kliknięcie działa jak zwykle
  box.addEventListener('pointerdown', e => {
    if (S.elView !== 'graph' || !box.querySelector('#gstage')) return;
    const middle = e.button === 1;
    if (!middle && (e.button !== 0 || e.target.closest('.gc-ed, button, input'))) return;
    if (middle) e.preventDefault(); // bez autoprzewijania przeglądarki
    const x0 = e.clientX, y0 = e.clientY, tx0 = G.tx, ty0 = G.ty;
    let pan = false;
    const mv = ev => {
      if (!pan && !middle && Math.hypot(ev.clientX - x0, ev.clientY - y0) < 5) return;
      if (!pan) { pan = true; box.classList.add('panning'); }
      G.tx = tx0 + ev.clientX - x0; G.ty = ty0 + ev.clientY - y0; applyGraphView();
    };
    const up = () => {
      window.removeEventListener('pointermove', mv); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up);
      box.classList.remove('panning');
      if (pan && !middle) G.panned = true; // następny „click" to koniec przesuwania, nie kliknięcie w okienko (środkowy nie daje „click")
    };
    window.addEventListener('pointermove', mv); window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
  });
  box.addEventListener('click', e => { if (G.panned) { G.panned = false; e.stopPropagation(); e.preventDefault(); } }, true);
  box.addEventListener('auxclick', e => { if (e.button === 1 && S.elView === 'graph') e.preventDefault(); });
  box.addEventListener('mousedown', e => { if (e.button === 1 && S.elView === 'graph') e.preventDefault(); });
})();
// zapis pozycji wielu okienek naraz: w trakcie bez przerysowań, na końcu jedno
async function saveGpos(changes) {
  if (!changes.length) return;
  for (const ch of changes) { const el = S.elements.find(x => x.id === ch.id); if (el) el.gpos = ch.gpos; }
  S.graphBusy = true;
  try { for (const ch of changes) await DB.update(pElements(S.project.id), ch.id, { gpos: ch.gpos }); }
  catch (err) { toast('Błąd zapisu: ' + err.message, 'error'); }
  S.graphBusy = false; S.graphDirty = false;
  renderElements();
}
// przerysowanie przy zmianie rozmiaru panelu — tylko przy prawdziwej zmianie i nigdy w trakcie przeciągania

if (window.ResizeObserver) {
  let tmr = null, last = '';
  graphRO = new ResizeObserver(entries => {
    const r = entries[0].contentRect, key = Math.round(r.width / 40) + 'x' + Math.round(r.height / 40);

// =====================================================================

// Zapis pliku: nazwa FIRMA_Index_v{wersja}_{data}, o wersję pytamy przed zapisem (podpowiadamy kolejną).
const dateStamp = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;

    ['', all.filter(e => !wys(e) && !isHang(e))],
    ['Blackback — wysłony', all.filter(wys).sort((a, b) => (a.wnum || 0) - (b.wnum || 0))],

    if (e.inside) head.push('zadruk zewnątrz i wewnątrz');

    const title = wrapCanvas(g, (r.opis ? r.opis + ' — ' : '') + r.typ + (r.qty > 1 ? `  × ${r.qty} szt.` : ''), w - 56, 3);
    g.font = `italic 400 ${FS * .9}px ${PDF_FONT}`;
    const nlines = r.uwagi ? wrapCanvas(g, r.uwagi, w - 10, 3) : [];

          ext(fx, fy + FH, fx, fy + FH + 86); ext(fx + FW, fy + FH, fx + FW, fy + FH + 86); hDim(fx, fx + FW, fy + FH + 82, r.bw);
          ext(fx, fy + bh, fx - 50, fy + bh); ext(fx, fy + FH - bh, fx - 50, fy + FH - bh); vDim(fy + bh, fy + FH - bh, fx - 46, r.bh - 2 * gb);
          ext(fx, fy, fx - 104, fy); ext(fx, fy + FH, fx - 104, fy + FH); vDim(fy, fy + FH, fx - 100, r.bh);

}
// TABELA A4 (poziomo): lista elementów + podsumowanie wg typu, ile trzeba stron
async function renderTableA4(stamp) {
  const PW = 2339, PH = 1654; // A4 ~200 dpi
  let logo = null; try { logo = await loadImg($('hdr-logo').src); } catch (e) {}
  const rows = exportRows(), pages = [];
  const cols = [['Znak', 80], ['Wizka', 85], ['Typ', 700], [`Netto [${UNIT()}]`, 280], ['Spad', 110], [`Do druku [${UNIT()}]`, 260], ['Szt.', 70], ['m²', 120], ['Uwagi', 0]];
  cols[cols.length - 1][1] = PW - 80 - cols.reduce((s, c) => s + c[1], 0);
  const RH = 50, TOP = 210, perPage = Math.floor((PH - TOP - 100) / RH);
  const total = Math.max(1, Math.ceil((rows.length + 6) / perPage));
  const summary = {};
  rows.forEach(r => { const s = summary[r.typ] = summary[r.typ] || { color: r.color, n: 0, m2: 0 }; s.n += r.qty; s.m2 += r.m2 || 0; });
  let idx = 0, pageNo = 0, done = false;
  while (!done) {
    pageNo++;
    const [c, g] = newCanvas(PW, PH); pages.push(c);
    pageHeader(g, PW, PH, logo, `Tabela ${pageNo} / ${total}`, stamp, 1);
    g.fillStyle = '#1a202c'; g.font = `700 32px ${PDF_FONT}`;
    g.fillText(`Lista elementów (${rows.length})`, 40, 175);
    let x = 40;
    g.fillStyle = '#edf2f7'; g.fillRect(40, TOP, PW - 80, RH);
    g.fillStyle = '#4a5568'; g.font = `700 21px ${PDF_FONT}`;
    cols.forEach(([n, w]) => { g.fillText(n.toUpperCase(), x + 10, TOP + 32); x += w; });
    let y = TOP + RH;
    while (idx < rows.length && y + RH <= PH - 90) {
      const r = rows[idx++];
      if (idx % 2 === 0) { g.fillStyle = '#f7fafc'; g.fillRect(40, y, PW - 80, RH); }
      x = 40;
      const cells = [null, r.wizka ? '#' + r.wizka : '—', (r.opis ? r.opis + ' — ' : '') + r.typ, r.w === '' ? 'do ustalenia' : r.net,
        r.spad ? bleedTxt(r.spad) : '—', r.w === '' ? '' : r.gross, String(r.qty), r.m2 === '' ? '' : numPL(r.m2), r.uwagi];
      cols.forEach(([n, w], j) => {
        if (j === 0) drawBadge(g, x + 30, y + RH / 2, 18, r.color, r.znak);
        else if (j === 2) {
          g.fillStyle = r.color; g.fillRect(x + 10, y + 17, 16, 16);
          g.fillStyle = '#1a202c'; g.font = `400 22px ${PDF_FONT}`; g.fillText(fitText(g, cells[j], w - 46), x + 34, y + 33);
        } else {
          g.fillStyle = (j === 3 && r.w === '') ? '#dd6b20' : (j === 8 ? '#4a5568' : '#1a202c');
          g.font = (j === 5 ? '700 ' : '400 ') + `22px ${PDF_FONT}`;
          g.fillText(fitText(g, cells[j], w - 20), x + 10, y + 33);
        }
        x += w;
      });
      g.strokeStyle = '#e2e8f0'; g.lineWidth = 1.5; g.beginPath(); g.moveTo(40, y + RH); g.lineTo(PW - 40, y + RH); g.stroke();
      y += RH;
    }
    if (idx >= rows.length) {
      const need = (Object.keys(summary).length + 2) * 42 + 40;
      if (y + need <= PH - 90 || !rows.length) {
        y += 40;
        g.fillStyle = '#1a202c'; g.font = `700 26px ${PDF_FONT}`; g.fillText('Podsumowanie wg typu', 40, y); y += 14;
        Object.entries(summary).forEach(([typ, s]) => {
          y += 40;
          g.fillStyle = s.color; g.fillRect(40, y - 20, 18, 18);
          g.fillStyle = '#1a202c'; g.font = `400 23px ${PDF_FONT}`;
          g.fillText(`${typ}: ${s.n} szt. · ${numPL(s.m2)} m²`, 72, y - 3);
        });
        const tot = rows.reduce((s, r) => s + (r.m2 || 0), 0), nd = rows.filter(r => r.w === '').length;
        y += 46; g.font = `700 24px ${PDF_FONT}`;
        g.fillText(`Razem: ${rows.reduce((s, r) => s + r.qty, 0)} szt. · ${numPL(tot)} m² do druku` + (nd ? `   (${nd} el. bez wymiaru — nie wliczone)` : ''), 40, y);
        done = true;

}
// druk przez okno drukowania przeglądarki: strony jako obrazki, format kartki z @page
function printPages(canvases, size) {
  const fr = document.createElement('iframe');
  fr.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden';
  document.body.appendChild(fr);
  const d = fr.contentDocument;
  d.open();
  d.write(`<!doctype html><html><head><title>${esc(S.project.name)} — INDEX</title><style>@page{size:${size} landscape;margin:0}html,body{margin:0;padding:0}
    img{display:block;width:100%;height:100vh;object-fit:contain;page-break-after:always;break-after:page}img:last-child{page-break-after:auto;break-after:auto}</style></head><body>
    ${canvases.map(c => `<img src="${c.toDataURL('image/jpeg', 0.92)}">`).join('')}</body></html>`);
  d.close();
  const go = () => { try { fr.contentWindow.focus(); fr.contentWindow.print(); } catch (e) { toast('Nie udało się otworzyć drukowania: ' + e.message, 'error'); } setTimeout(() => fr.remove(), 60000); };
  const imgs = [...d.images];
  Promise.all(imgs.map(i => i.complete ? 1 : new Promise(r => { i.onload = i.onerror = r; }))).then(go);
}
// Index A3 / Tabela A4: druk albo zapis PDF z nazwą FIRMA_Index_vN_data
async function exportDoc(w, mode, v) {
  if (mode === 'save' && !window.jspdf) return toast('Brak biblioteki PDF (sprawdź internet)', 'error');
  const t = toast(w === 'a3' ? 'Tworzenie indexu A3…' : 'Tworzenie tabeli A4…', '', 120000);
  try {
    const p = S.project, ver = mode === 'save' ? v : (Number(p.indexVersion) || 0);
    const stamp = (ver ? `Index_v${ver}  ` : 'Index  ') + dateStamp();
    const pages = w === 'a3' ? [await renderIndexA3(stamp)] : await renderTableA4(stamp);
    if (mode === 'print') {
      printPages(pages, w === 'a3' ? 'A3' : 'A4');
      addLog(p.id, w === 'a3' ? 'Wydrukowano index (A3)' : 'Wydrukowano tabelę elementów (A4)');
    } else {
      const fmt = w === 'a3' ? [420, 297] : [297, 210];
      const pdf = new jspdf.jsPDF({ orientation: 'landscape', unit: 'mm', format: w === 'a3' ? 'a3' : 'a4', compress: true });
      pages.forEach((c, i) => { if (i) pdf.addPage(); pdf.addImage(c.toDataURL('image/jpeg', 0.9), 'JPEG', 0, 0, fmt[0], fmt[1]); });
      pdf.save(fileBase(v) + (w === 'a3' ? '.pdf' : '_tabela.pdf'));
      if (v > (Number(p.indexVersion) || 0)) await DB.update(C_PROJECTS, p.id, { indexVersion: v });
      addLog(p.id, w === 'a3' ? `Wyeksportowano index v${v} (A3, PDF)` : `Wyeksportowano tabelę elementów v${v} (A4, PDF)`);
    }
  } catch (e) {
    console.error(e);
    toast('Błąd PDF: ' + e.message, 'error', 6000);
  }
  t.remove();
}

// =====================================================================
//  ALPAKA — co 5 minut dobiega do 1/4 ekranu, mruga i wraca
// =====================================================================
// losowo: wybiega z lewej, z prawej albo (w stoisku) spada na spadochronie ze środkowej belki nad zegarem
function runAlpaca() {
  const a = $('alpaca'); if (!a || !a.animate || document.hidden || a.dataset.busy) return;
  const bar = $('split-h'), clock = $('clock-pane'), r = Math.random();
  const para = S.project && bar && clock && bar.offsetParent && clock.offsetParent && clock.getBoundingClientRect().width > 0;
  a.dataset.busy = '1';
  const done = () => { a.style.display = 'none'; a.className = ''; delete a.dataset.busy; };
  (para && r < 0.34 ? alpacaParachute(a, bar, clock) : alpacaRun(a, r < 0.67 ? 'left' : 'right')).then(done, done);
}
const alpGo = (a, from, to, flip, ms, easing = 'ease-in-out') => a.animate(
  [{ transform: `translate(${from[0]}px, ${from[1]}px) scaleX(${flip})` }, { transform: `translate(${to[0]}px, ${to[1]}px) scaleX(${flip})` }],
  { duration: ms, easing, fill: 'forwards' }).finished;
// dobiega do 1/4 (z lewej) albo 3/4 (z prawej) szerokości ekranu, mruga i wraca
function alpacaRun(a, side) {
  const w = a.offsetWidth || 76, W = innerWidth;
  const off = side === 'left' ? -w - 10 : W + 10, mid = side === 'left' ? W / 4 - w / 2 : W * 3 / 4 - w / 2;
  const dir = side === 'left' ? 1 : -1, ms = Math.max(1800, Math.abs(mid - off) * 4.5);
  a.style.display = 'block'; a.className = 'run';
  return alpGo(a, [off, 0], [mid, 0], dir, ms)
    .then(() => { a.className = 'stop'; return new Promise(r => setTimeout(r, 1200)); })
    .then(() => { a.className = 'run'; return alpGo(a, [mid, 0], [off, 0], -dir, ms); });
}
// spadochron: start na belce nad zegarem, łagodne kołysanie w dół, po wylądowaniu ucieka w bok
function alpacaParachute(a, bar, clock) {
  const w = a.offsetWidth || 76, h = a.offsetHeight || 76, W = innerWidth;
  const br = bar.getBoundingClientRect(), cr = clock.getBoundingClientRect();
  const x = clamp(cr.left + cr.width / 2 - w / 2, 10, W - w - 10);
  const ground = innerHeight - 2 - h, ty0 = br.top - h * 0.35 - ground; // przesunięcie w górę od dołu ekranu
  a.style.display = 'block'; a.className = 'para';
  const fall = a.animate([
    { transform: `translate(${x}px, ${ty0}px) rotate(-7deg)` },
    { transform: `translate(${x + 14}px, ${ty0 * 0.66}px) rotate(7deg)` },
    { transform: `translate(${x - 10}px, ${ty0 * 0.33}px) rotate(-5deg)` },
    { transform: `translate(${x}px, 0px) rotate(0deg)` },
  ], { duration: Math.max(4200, -ty0 * 9), easing: 'ease-in-out', fill: 'forwards' }).finished;
  return fall
    .then(() => { a.className = 'stop'; return new Promise(r => setTimeout(r, 900)); })
    .then(() => {
      a.className = 'run';
      const right = x < W / 2 ? -1 : 1, to = right > 0 ? W + 10 : -w - 10;
      return alpGo(a, [x, 0], [to, 0], right, Math.max(1500, Math.abs(to - x) * 4));
    });
}
setTimeout(runAlpaca, 30000);
setInterval(runAlpaca, 5 * 60 * 1000);

  const rs = sels.flatMap(q => [...document.querySelectorAll(q)]).map(e => e.getBoundingClientRect()).filter(r => r.width && r.height);
  if (!rs.length) return null;
  const l = Math.min(...rs.map(r => r.left)), t = Math.min(...rs.map(r => r.top)), r = Math.max(...rs.map(r => r.right)), b = Math.max(...rs.map(r => r.bottom));
  return { left: l, top: t, width: r - l, height: b - t };
}

let tourBlockedAt = 0;
function tourDB(real) {
  const no = (path, id) => async () => {
    // statystyki stoiska zapisują się same przy otwarciu — bez komunikatu
    if (path !== C_PROJECTS && Date.now() - tourBlockedAt > 4000) { tourBlockedAt = Date.now(); toast(TOUR_UI.blocked); }
    return 'tour-' + uid();
  };
  return { ...real, add: (path) => no(path)(), set: (path) => no(path)(), update: (path) => no(path)(), del: (path) => no(path)() };
}
async function waitFor(fn, ms = 4000) {
  const t0 = Date.now();
  while (Date.now() - t0 < ms) { const v = fn(); if (v) return v; await new Promise(r => setTimeout(r, 80)); }
  return null;
}
async function startTour(pro = false) {
  if (S.tour || !S.me) return;
  if (pro && !isAdmin()) return;
  const p = S.projects.find(x => x.id === TOUR_PID) || S.projects.find(x => String(x.name || '').trim().toLowerCase() === TOUR_NAME);
  if (!p) { toast(TOUR_UI.missing, 'error'); return; }
  document.querySelectorAll('.menu').forEach(m => m.remove());
  while (modalStack.length) modalStack[modalStack.length - 1].close();
  const steps = pro ? TOUR_PRO : TOUR_STEPS;
  S.tour = { pid: p.id, pro, steps, prevPid: S.project ? S.project.id : null, prevView: S.elView, prevSide: S.sideSel, realDB: DB, i: 0, voiceOn: pro, voice: pro ? shVoice() : null };
  DB = tourDB(DB);
  const block = document.createElement('div'); block.id = 'tour-block';
  const hl = document.createElement('div'); hl.id = 'tour-hl';
  const tip = document.createElement('div'); tip.id = 'tour-tip'; tip.setAttribute('data-noi18n', '');
  block.addEventListener('pointerdown', e => e.preventDefault());
  block.addEventListener('wheel', e => e.preventDefault(), { passive: false });
  document.body.append(block, hl, tip);
  S.tour.keys = e => {
    if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); endTour(); }
    else if (e.key === 'ArrowRight' || e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); tourGo(S.tour.i + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); e.stopPropagation(); tourGo(S.tour.i - 1); }
  };
  document.addEventListener('keydown', S.tour.keys, true);
  S.tour.timer = setInterval(tourPlace, 250);
  addEventListener('resize', tourPlace);
  await openProject(p.id);
  if (!S.tour) return;
  await waitFor(() => S.photos.length && S.elements.length, 6000);
  await waitFor(photosReady, 6000);
  fitView();
  tourGo(0);
}
async function tourGo(i) {
  const T = S.tour; if (!T || T.busy) return;
  if (i >= T.steps.length) return endTour();
  if (i < 0) return;
  T.busy = true;
  const prev = T.steps[T.i];
  if (prev && prev.after && T.shown) { try { prev.after(); } catch (e) {} }
  T.i = i; T.shown = false;
  const st = T.steps[i];
  if (st.before) { try { st.before(); } catch (e) { console.warn(e); } }
  if (st.wait) await waitFor(st.wait, 3000);
  if (!S.tour) return;
  T.shown = true; T.busy = false;
  const n = T.steps.length;
  $('tour-tip').innerHTML = `<div class="tt-h">${st.title}<span class="tt-n">${i + 1} / ${n}</span></div>
    <div class="tt-b">${st.text}</div>
    ${i === 0 ? `<div class="tt-ro">${TOUR_UI.ro}</div>` : ''}
    <div class="tt-f"><div class="tt-dots">${T.steps.map((_, k) => `<i class="${k === i ? 'on' : ''}"></i>`).join('')}</div>
      ${i > 0 ? `<button class="btn btn-sm" data-tb>${TOUR_UI.back}</button>` : `<button class="btn btn-sm" data-tx>${TOUR_UI.skip}</button>`}
      ${T.pro ? `<button class="btn btn-sm" data-tv title="${SHOW_UI.mute}">${T.voiceOn ? '🔊' : '🔇'}</button>` : ''}
      <button class="btn btn-sm btn-solid" data-tn>${i === n - 1 ? TOUR_UI.end : TOUR_UI.next}</button></div>`;
  const tip = $('tour-tip');
  if (tip.querySelector('[data-tb]')) tip.querySelector('[data-tb]').onclick = () => tourGo(i - 1);
  if (tip.querySelector('[data-tx]')) tip.querySelector('[data-tx]').onclick = endTour;
  tip.querySelector('[data-tn]').onclick = () => tourGo(i + 1);
  const tv = tip.querySelector('[data-tv]');
  if (tv) tv.onclick = () => { T.voiceOn = !T.voiceOn; tv.textContent = T.voiceOn ? '🔊' : '🔇'; if (T.voiceOn) tourSpeak(st); else speechSynthesis.cancel(); };
  tourSpeak(st);
  tourPlace();
  tip.querySelector('[data-tn]').focus();
}
function tourRect(st) {

  const r = v.getBoundingClientRect ? v.getBoundingClientRect() : v;
  return r.width || r.height ? r : null;
}

// pasek etapów: klik w etap = przeskok; kropka jedzie razem z pokazem i można ją przeciągnąć w przód / w tył
function shStages() {
  const T = SH(); if (!T || !T.chapters) return;
  const box = $('show-stages'); if (!box) return;
  const n = T.chapters.length, cur = Math.min(T.cur || 0, n - 1);
  if (box.dataset.n !== String(n)) {
    box.dataset.n = n;
    box.innerHTML = `<div class="sc-segs">${T.chapters.map((c, i) => `<button type="button" data-k="${i}" title="${i + 1}. ${esc(c.name)}"><i></i><span>${esc(c.name)}</span></button>`).join('')}</div>
      <div class="sc-dot-wrap"><div class="sc-play" id="show-dot"><b id="show-dot-lab"></b></div></div>`;
    shScrubInit(box);
  }
  box.querySelectorAll('.sc-segs button').forEach((b, i) => { b.classList.toggle('done', i < (T.cur || 0)); b.classList.toggle('on', i === T.cur); });

// pozycja kropki: początek etapu + szacowana część etapu, która już minęła (stoi w czasie pauzy)
function shDotPos() {
  const T = SH(); if (!T || !T.chapters) return 0;
  const n = T.chapters.length; if ((T.cur || 0) >= n) return 1;
  const c = T.chapters[T.cur || 0], est = (c.est || 15) * 1000 * (T.fast ? 0.5 : 1);
  return ((T.cur || 0) + Math.min(0.96, (T.chMs || 0) / est)) / n;
}
function shDot(pos) {
  const d = $('show-dot'); if (!d) return;
  d.style.left = ((pos == null ? shDotPos() : pos) * 100) + '%';
}
function shScrubInit(box) {
  const T = SH(); if (!T) return;
  const segs = box.querySelector('.sc-segs');
  const posAt = x => { const r = segs.getBoundingClientRect(); return clamp((x - r.left) / r.width, 0, 0.9999); };
  box.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    e.preventDefault();
    const S0 = SH(); if (!S0) return;
    S0.scrub = { x0: e.clientX, wasPaused: !!S0.paused, moved: false };
    box.setPointerCapture(e.pointerId);
    const mv = ev => {
      const sc = S0.scrub; if (!sc) return;
      if (!sc.moved && Math.abs(ev.clientX - sc.x0) < 4) return;
      if (!sc.moved) { sc.moved = true; if (!S0.paused && S0.setPause) S0.setPause(true); box.classList.add('scrub'); }
      const pos = posAt(ev.clientX), k = Math.floor(pos * S0.chapters.length);
      shDot(pos);
      $('show-dot-lab').textContent = `${k + 1}. ${S0.chapters[k].name}`;
      box.querySelectorAll('.sc-segs button').forEach((b, i) => b.classList.toggle('hov', i === k));
    };
    const up = ev => {
      box.removeEventListener('pointermove', mv); box.removeEventListener('pointerup', up); box.removeEventListener('pointercancel', up);
      const sc = S0.scrub; S0.scrub = null;
      box.classList.remove('scrub');
      box.querySelectorAll('.sc-segs button.hov').forEach(b => b.classList.remove('hov'));
      $('show-dot-lab').textContent = '';
      if (!sc) return;
      // klik albo puszczenie kropki = przeskok dokładnie w to miejsce: etap pod kursorem + przewinięcie w jego głąb
      const n = S0.chapters.length, pos = posAt(ev.clientX), k = Math.floor(pos * n), frac = pos * n - k;
      shDot(pos);
      shJump(k, frac > 0.04 ? frac * (S0.chapters[k].est || 15) * 1000 : 0);
    };
    box.addEventListener('pointermove', mv); box.addEventListener('pointerup', up); box.addEventListener('pointercancel', up);
  });
  // zegar kropki: czas w bieżącym etapie (bez pauz i przeciągania)
  let last = performance.now();
  T.dotTimer = setInterval(() => {
    const now = performance.now(), dt = now - last; last = now;
    const S1 = SH(); if (!S1) return;
    if (!S1.paused && !S1.scrub && !S1.rebuilding && !(S1.skip > 0)) S1.chMs = (S1.chMs || 0) + dt;
    if (!S1.scrub && !S1.rebuilding) shDot();
  }, 120);
}
function shJump(k, seekMs = 0) {
  const T = SH(); if (!T || !T.chapters) return;
  if (k < 0 || k >= T.chapters.length) return;
  T.jumpTo = k; T.seekMs = seekMs;
  if (T.paused && T.setPause) T.setPause(false);
  if ('speechSynthesis' in window) speechSynthesis.cancel();
}

async function shSettle() {
  const T = SH(); if (!T) return;
  const nE = T.mem.count(pElements(SHOW_PID)), nP = T.mem.count(pPhotos(SHOW_PID));
  await plainUntil(() => S.elements.length === nE && S.photos.length === nP, 4000);
  if (nP) await plainUntil(() => { const im = [...document.querySelectorAll('#stage-imgs img')]; return im.length && im.every(i => i.complete && i.naturalWidth); }, 6000);
}
// okno elementu dwuklikiem na znaku (jak użytkownik); gdy znaku nie widać — przez ✎ w tabeli
async function shOpenEl(eid) {
  const node = () => document.querySelector(`#overlay g.shp[data-eid="${eid}"] [data-part="lab"]`) || document.querySelector(`#overlay g.shp[data-eid="${eid}"]`);
  const n0 = await shWaitFor(node, 1500);
  if (n0) {
    const [x, y] = shCenter(n0);
    await shMove(x, y, 750); await shWait(120);
    shRipple(); shPtr('pointerdown', n0, x, y); shPtr('pointerup', viewer, x, y);
    await plainWait(90);
    const n1 = node(); shRipple(); if (n1) { shPtr('pointerdown', n1, x, y); shPtr('pointerup', viewer, x, y); }
  } else openElementDialog({ id: eid });
  await shWaitFor(() => $('ed-q'), 3000);
  await shWait(500);
}
async function shCancelDlg() { const c = document.querySelector('.modal-back [data-c]'); if (c) await shClick(c, 600); else proClose(); await shWait(300); }
// teksty slajdów PRO bez „Dima,” — imię dokłada sayP co piąty etap (0, 5, 10…)
const PT = i => { const t = TOUR_PRO[i] ? TOUR_PRO[i].text : ''; const m = t.match(/^(Dima|Діма), (.)(.)/);
  return m ? (/[a-ząćęłńóśźżа-яіїєґ]/.test(m[3]) ? m[2].toUpperCase() : m[2]) + m[3] + t.slice(m[0].length) : t; };
const DIMA = TT('Dima', 'Діма', 'Dima');
async function sayP(text) {
  const T = SH(); if (!T) return;
  const name = (T.cur || 0) % 5 === 0 && T.cur > 0 && T.namedAt !== T.cur; // raz na etap
  if (name) T.namedAt = T.cur;
  // po imieniu mała litera — ale nazwy funkcji i programów zostają wielką (Turbo, Archiwum X, Corel, INDEX)
  const keep = /^(Turbo|Турбо|Archiwum|Corel|INDEX|Zlecenie|Замовлення|Order)/.test(text);
  await shSay(name ? `${DIMA}, ${!keep && /^[A-ZĄĆĘŁŃÓŚŹŻА-ЯІЇЄҐ][a-ząćęłńóśźżа-яіїєґ]/.test(text) ? text[0].toLowerCase() + text.slice(1) : text}` : text);
}

// przeskok: puste stoisko, potem błyskawicznie wszystkie wcześniejsze etapy, dalej normalnie
async function shRebuildTo(k) {
  const T = SH(); if (!T) return;
  shCleanup();
  T.inst = { num: 0, w: 0 };
  T.mem.wipe(C_PROJECTS);
  setElView('table');
  await plainUntil(() => !S.photos.length && !S.elements.length, 3000);
  if (T.setup) { await T.setup(); await shSettle(); }
  for (let j = 0; j < k; j++) if (T.chapters[j].instant) { await T.chapters[j].instant(); await shSettle(); }
  const nP = T.mem.count(pPhotos(SHOW_PID)), nE = T.mem.count(pElements(SHOW_PID));
  await plainUntil(() => S.photos.length === nP && S.elements.length === nE, 4000);
  if (nP) await plainUntil(() => { const im = [...document.querySelectorAll('#stage-imgs img')]; return im.length && im.every(i => i.complete && i.naturalWidth); }, 6000);
  fitView();
  if (S.elView === 'graph') { await plainWait(150); graphFit(); }
  await plainWait(200);
}
async function runShow(photos, els) {
  const T = S.tour;
  T.chapters = T.pro ? proChapters(photos, T.allEls) : showChapters(photos, els); T.cur = 0;
  await openProject(SHOW_PID);
  setElView('table');
  if (T.setup) { await T.setup(); await shSettle(); }
  shStages();
  await plainWait(600);
  let i = 0;
  while (i < T.chapters.length) {
    try {
      T.cur = i; T.chMs = 0; T.namedAt = -1; T.skip = T.seekMs || 0; T.seekMs = 0; shStages();
      await T.chapters[i].run();
      T.skip = 0;
      i++;
    } catch (e) {
      if (!(e instanceof ShowJump)) throw e;
      const k = T.jumpTo; T.jumpTo = null; T.skip = 0;
      T.cur = k; T.chMs = 0; T.rebuilding = true; shStages();
      // kropka czeka w miejscu, w które ją puszczono, aż etap się odbuduje
      if (T.seekMs) shDot((k + Math.min(0.96, T.seekMs / ((T.chapters[k].est || 15) * 1000))) / T.chapters.length);
      try { await shRebuildTo(k); } finally { T.rebuilding = false; }
      if (!SH() || SH().stop) throw new ShowStop();
      i = k;
    }
  }
  T.cur = T.chapters.length; shStages(); shDot(1);
}
function endShow() {
  const T = S.tour; if (!T || !T.show) return;
  T.stop = true;
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  closeArcMenu(true);
  while (modalStack.length) modalStack[modalStack.length - 1].close();
  document.removeEventListener('keydown', T.keys, true);
  clearInterval(T.dotTimer);
  ['show-block', 'show-cursor', 'show-cap'].forEach(id => { const e = $(id); if (e) e.remove(); });
  document.querySelectorAll('.show-ripple, .show-key').forEach(e => e.remove());
  if (T.spc) Element.prototype.setPointerCapture = T.spc;
  if (S.graphMove) toggleGraphMove(false);
  S.graphBusy = false;
  $('clock-pane').classList.remove('show-hl');
  toggleSide(T.sideWas); toggleLog(T.logWas);
  liveShape = null; act = null;
  if (S.turbo) endTurbo();
  document.querySelectorAll('.menu').forEach(m => m.remove());
  try { localStorage.removeItem(`INDEX_SEEN_${S.me.id}_${SHOW_PID}`); } catch (e) {}
  DB = T.realDB;
  S.tour = null;
  if (S.elView !== T.prevView) setElView(T.prevView);
  S.sideSel = T.prevSide;
  if (T.prevPid) openProject(T.prevPid);
  else { goHome(); history.replaceState(null, '', location.pathname + (MODE_QS ? '?' + MODE_QS : '')); renderSide(); }
}

  if (DEMO) {
    DB = LocalDB;
    const b = document.createElement('div'); b.className = 'demo-badge'; b.textContent = 'TRYB DEMO — dane tylko w tej przeglądarce';
    document.body.appendChild(b);
  } else {
    if (TEST) {
      const b = document.createElement('div'); b.className = 'demo-badge'; b.textContent = 'PIASKOWNICA — kolekcje testowe (zztest), prawdziwe dane nietknięte';
      document.body.appendChild(b);
    }
    try {
      if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
      db = firebase.firestore();
      DB = FireDB;
    } catch (e) {
      $('login-err').textContent = 'Brak połączenia z bazą: ' + e.message;
      return;
    }
  }
  $('login-btn').disabled = true;
  await reloadUsers();
  $('login-btn').disabled = false;
  DB.sub(C_USERS, rows => {
    S.users = mergeUsers(rows);
    if (S.me) { const me = userById(S.me.id); if (me) { S.me = me; renderMyAvatar(); } }
    else renderLoginAvatars();
  });
  // zapamiętana sesja
  try {
    const sess = JSON.parse(localStorage.getItem('INDEX_SESSION') || 'null');
    const u = sess && userById(sess.id);
    if (u && u.passHash && u.passHash === sess.h) return enterApp(u);
  } catch (e) {}
  showScreen('screen-login');
  renderLoginAvatars();
});
